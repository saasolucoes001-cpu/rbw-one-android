<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RBW One — APK mais recente</title>
<style>body{font:16px/1.6 system-ui;background:#f4f7fa;color:#183a5b;padding:24px}main{max-width:640px;margin:32px auto;background:white;padding:28px;border-radius:20px}a{color:#004889}.download{display:inline-block;background:#004889;color:white;padding:12px 22px;border-radius:12px;text-decoration:none}small{overflow-wrap:anywhere}</style>
<main><h1>RBW One para Android</h1><p id="status" role="status">Consultando a versão mais recente…</p>
<p id="notice"></p><p><a id="download" class="download" hidden>Baixar APK</a></p>
<p>Android 6 ou superior. A instalação depende da confirmação do Android.</p><small id="integrity"></small>
<noscript>Ative JavaScript para consultar o instalador mais recente.</noscript></main>
<script type="module">
const status=document.querySelector("#status"), link=document.querySelector("#download");
try {
 const response=await fetch("./native-latest.json?t="+Date.now(),{cache:"no-store",signal:AbortSignal.timeout(10000)});
 if(!response.ok)throw Error();
 const release=await response.json(), url=new URL(release.apkUrl,location.href);
 if(release.packageName!=="br.com.rbwone.nativepreview" || url.origin!==location.origin || !url.pathname.startsWith("/rbw-one-android/") || !/^\/rbw-one-android\/[^/]+\.apk$/.test(url.pathname) || url.search || url.hash || !/^[a-f0-9]{64}$/.test(release.sha256))throw Error();
 status.textContent="Versão mais recente: "+release.versionName;
 document.querySelector("#notice").textContent=release.notice || "";
 document.querySelector("#integrity").textContent="SHA-256: "+release.sha256;
 link.href=url.href;link.download="";link.hidden=false;
} catch {status.textContent="Não foi possível consultar a versão atual. Recarregue a página para tentar novamente."; }
</script></html>
