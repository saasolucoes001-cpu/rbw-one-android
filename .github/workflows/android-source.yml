name: Android source checks
on:
  pull_request:
    paths: ['app/**', 'scripts/web-downloads.test.mjs', 'scripts/web-printing.test.mjs', 'gradle/**', '*.gradle', 'gradle.properties', 'gradlew*', '.github/workflows/android-source.yml']
  push:
    branches: [main]
    paths: ['app/**', 'scripts/web-downloads.test.mjs', 'scripts/web-printing.test.mjs', 'gradle/**', '*.gradle', 'gradle.properties', 'gradlew*', '.github/workflows/android-source.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/web-downloads.test.mjs scripts/web-printing.test.mjs
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
